# Run by Dockhand as a git stack on the Mac mini, which builds the image from
# this repo. Settings come from the stack's env in Dockhand:
#   CONTAINER_NAME        container and network name (default shawn-api; Cronicle calls http://shawn-api:3000)
#   SHAWN_API_HOST_PORT   port on the Mac mini (default 3010)
#   NPM_TOKEN             GitHub token with read:packages, for the private @shawnphoffman packages
# The service is called "app" rather than shawn-api so that a second copy of
# this stack (for testing) never answers to the name Cronicle calls.

x-common: &common
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

networks:
  mac-mini-shared:
    external: true

secrets:
  npm_token:
    environment: NPM_TOKEN

services:
  app:
    build:
      context: .
      secrets:
        - npm_token
    image: ${CONTAINER_NAME:-shawn-api}:local
    container_name: ${CONTAINER_NAME:-shawn-api}
    <<: *common
    networks:
      - mac-mini-shared
    # Dockhand's stack env only fills ${...} here; the container sees just what is listed.
    # A new variable the app reads needs a line here as well as a value in Dockhand.
    environment:
      BSKY_PASSWORD: ${BSKY_PASSWORD:-}
      BSKY_USERNAME: ${BSKY_USERNAME:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DEV_WEBHOOK_ID: ${DEV_WEBHOOK_ID:-}
      DEV_WEBHOOK_TOKEN: ${DEV_WEBHOOK_TOKEN:-}
      DISABLE_CORS: ${DISABLE_CORS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_WEBHOOK_BOOKS: ${DISCORD_WEBHOOK_BOOKS:-}
      DISCORD_WEBHOOK_BOT_ALERTS: ${DISCORD_WEBHOOK_BOT_ALERTS:-}
      DISCORD_WEBHOOK_BOT_SF6: ${DISCORD_WEBHOOK_BOT_SF6:-}
      DISCORD_WEBHOOK_COMICS: ${DISCORD_WEBHOOK_COMICS:-}
      DISCORD_WEBHOOK_ID: ${DISCORD_WEBHOOK_ID:-}
      DISCORD_WEBHOOK_ID_FRIENDS: ${DISCORD_WEBHOOK_ID_FRIENDS:-}
      DISCORD_WEBHOOK_ID_SHAWN_DEV: ${DISCORD_WEBHOOK_ID_SHAWN_DEV:-}
      DISCORD_WEBHOOK_ID_YOUTUBE: ${DISCORD_WEBHOOK_ID_YOUTUBE:-}
      DISCORD_WEBHOOK_TOKEN: ${DISCORD_WEBHOOK_TOKEN:-}
      DISCORD_WEBHOOK_TOKEN_FRIENDS: ${DISCORD_WEBHOOK_TOKEN_FRIENDS:-}
      DISCORD_WEBHOOK_TOKEN_SHAWN_DEV: ${DISCORD_WEBHOOK_TOKEN_SHAWN_DEV:-}
      DISCORD_WEBHOOK_TOKEN_YOUTUBE: ${DISCORD_WEBHOOK_TOKEN_YOUTUBE:-}
      DISCORD_WEBHOOK_TV: ${DISCORD_WEBHOOK_TV:-}
      ENABLED_JOBS: ${ENABLED_JOBS:-}
      FEED_GEN_FORCE_KEY: ${FEED_GEN_FORCE_KEY:-}
      FEED_GEN_URL: ${FEED_GEN_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      NEXT_PUBLIC_AXIOM_INGEST_ENDPOINT: ${NEXT_PUBLIC_AXIOM_INGEST_ENDPOINT:-}
      PUPPETEER_WSS: ${PUPPETEER_WSS:-}
      PURPLE_API_KEY: ${PURPLE_API_KEY:-}
      QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:-}
      QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:-}
      RSS_BLUE_HARVEST_PATREON: ${RSS_BLUE_HARVEST_PATREON:-}
      SANITY_API_WRITE_TOKEN: ${SANITY_API_WRITE_TOKEN:-}
      SANITY_DATASET: ${SANITY_DATASET:-}
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
      SANITY_REVALIDATE_SECRET: ${SANITY_REVALIDATE_SECRET:-}
      SCRAPE_SECRET: ${SCRAPE_SECRET:-}
      SYNO_HOST: ${SYNO_HOST:-}
      SYNO_OTP_KEY: ${SYNO_OTP_KEY:-}
      SYNO_PASSWORD: ${SYNO_PASSWORD:-}
      SYNO_SEARCH_PATH: ${SYNO_SEARCH_PATH:-}
      SYNO_SECRET: ${SYNO_SECRET:-}
      SYNO_USERNAME: ${SYNO_USERNAME:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      WEBHOOKS_GITHUB_BH_SECRET: ${WEBHOOKS_GITHUB_BH_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - ${SHAWN_API_HOST_PORT:-3010}:3000
