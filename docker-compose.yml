x-common: &common
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - mac-mini-shared

networks:
  mac-mini-shared:
    external: true

services:
  shawn-api:
    image: ghcr.io/shawnphoffman/shawn-api:latest
    container_name: shawn-api
    <<: *common
    env_file:
      - .env
    ports:
      - ${SHAWN_API_HOST_PORT:-3010}:3000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=shawn"
      - "com.centurylinklabs.watchtower.restart=true"
